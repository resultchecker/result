body{

.result-container{
    width:100%;

.student-info div{

}

.exam-year{

    font-size:30px;
    font-weight:bold;
    margin:30px 0;
}

/* Makes table responsive */
.table-responsive{
    width:100%;
    overflow-x:auto;
}

.result-table{
    width:100%;
    min-width:900px;
    border-collapse:collapse;
}

.result-table th,
.result-table td{
    border:1px solid #ccc;
    padding:12px;
    text-align:center;
    font-size:15px;
}

.result-table th{
    background:#f5f5f5;
}

.sgpa-row{
    background:#fafafa;
    font-weight:bold;
}

.status{
    text-align:center;
    margin-top:25px;
    font-size:35px;
    font-weight:bold;
}

.status span{
    color:#22c55e;
}

.note{
    margin-top:25px;
    font-size:15px;
}

/* Mobile */

@media(max-width:768px){

body{
    padding:10px;
}

.result-container{
    padding:15px;
}

.logo{
    width:170px;
}

.student-info{
    display:block;
}

.student-info p{
    font-size:20px;
    margin:12px 0;
}

.exam-year{
    font-size:22px;
}

.status{
    font-size:28px;
}

.note{
    font-size:14px;
}

}

</style>
